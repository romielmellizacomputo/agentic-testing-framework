name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate test cases
        run: node tools/validate-cases.mjs
      - name: Scan for secrets and personal data
        run: node tools/check-secrets.mjs
      - name: Self-test (plan -> record -> report)
        run: node tools/selftest.mjs
