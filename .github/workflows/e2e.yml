name: E2E tests (manual)

# Run from GitHub: Actions -> "E2E tests (manual)" -> Run workflow -> pick project / environment / suite.
# "run_on: my-computer" sends the job to your own PC (a self-hosted runner, see docs/RUNNING-IN-GITHUB.md),
# where "show_browser" opens a real Chrome window you can watch.
on:
  workflow_dispatch:
    inputs:
      project:
        description: App under test
        type: choice
        options: [hqzen]
        default: hqzen
      environment:
        description: Test environment (develop and staging run the same code)
        type: choice
        options: [develop, staging]
        default: develop
      suite:
        description: Which tests to run
        type: choice
        options:
          - smoke        # public pages, sign-in, fresh account creation (~2 min)
          - isolation    # two fresh executives must not see each other's workforce
          - regression   # executive workflows + approver page health
          - full         # everything except email-dependent flows
        default: smoke
      run_on:
        description: "Where to run: github (GitHub's machine, no window) or my-computer (your PC, needs the runner open)"
        type: choice
        options: [github, my-computer]
        default: github
      show_browser:
        description: "my-computer only: open a visible Chrome window, slowed down so you can follow"
        type: boolean
        default: true
      create_accounts:
        description: Allow creating fresh test accounts (business sign-up)
        type: boolean
        default: true
      email_delivery:
        description: Environment delivers email to disposable inboxes (enables applicant/hiring flows)
        type: boolean
        default: false
      record_video:
        description: "Record videos to watch the flow afterwards (CAUTION: shows develop data; any signed-in GitHub user can download artifacts of a public repo; kept 3 days)"
        type: choice
        options: ['off', failures, all]
        default: 'off'

permissions:
  contents: read

concurrency:
  group: e2e-${{ inputs.project }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  e2e:
    name: ${{ inputs.project }} / ${{ inputs.environment }} / ${{ inputs.suite }} (${{ inputs.run_on }})
    # my-computer = a self-hosted runner registered with the label "agt-local".
    runs-on: ${{ inputs.run_on == 'my-computer' && fromJSON('["self-hosted","agt-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    # Secrets live in the GitHub Environment with the same name (Settings -> Environments -> develop|staging).
    environment: ${{ inputs.environment }}
    env:
      CI: 'true'
      AGT_PROJECT: ${{ inputs.project }}
      AGT_ENV: ${{ inputs.environment }}
      AGT_EMAIL_DELIVERY: ${{ inputs.email_delivery && '1' || '0' }}
      AGT_NO_ACCOUNTS: ${{ !inputs.create_accounts && '1' || '0' }}
      # Visible, slowed-down browser only on your own computer (GitHub's machines have no screen).
      AGT_HEADED: ${{ inputs.run_on == 'my-computer' && inputs.show_browser && '1' || '0' }}
      AGT_SLOWMO: ${{ inputs.run_on == 'my-computer' && inputs.show_browser && '400' || '0' }}
      # On your computer use the installed Google Chrome instead of downloading Chromium.
      AGT_CHANNEL: ${{ inputs.run_on == 'my-computer' && 'chrome' || '' }}
      # Standing approver (the only existing account the flows use). Stored as secrets, never in code.
      AGT_APPROVER_EMAIL: ${{ secrets.AGT_APPROVER_EMAIL }}
      AGT_APPROVER_PASSWORD: ${{ secrets.AGT_APPROVER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        if: inputs.run_on == 'github'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        env:
          AGT_GREP: ${{ inputs.suite == 'smoke' && '@smoke' || inputs.suite == 'isolation' && '@isolation' || inputs.suite == 'regression' && '@regression' || '@smoke|@isolation|@regression|@security' }}
          AGT_VIDEO: ${{ inputs.record_video == 'all' && 'on' || inputs.record_video == 'failures' && 'failures' || 'off' }}
        run: npx playwright test

      - name: Summary
        if: always()
        run: node tools/e2e/summary.mjs --github

      # Only the JUnit file is uploaded: no screenshots, traces or page content (public repository).
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ inputs.project }}-${{ inputs.environment }}-${{ inputs.suite }}
          path: reports/e2e/junit.xml
          retention-days: 7
          if-no-files-found: ignore

      # Opt-in only (record_video input). Videos show real pages of the test environment.
      - name: Upload videos
        if: always() && inputs.record_video != 'off'
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ inputs.project }}-${{ inputs.environment }}-${{ inputs.suite }}
          path: reports/e2e/artifacts/**/*.webm
          retention-days: 3
          if-no-files-found: ignore
